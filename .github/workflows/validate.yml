name: Validar rascunhos e sincronização
on:
  pull_request:
  push:
    branches-ignore: [main, auto/rascunho-releases]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Garantir que rascunhos não estejam no build
        run: |
          if find dist -name 'resumo-2026-09-30*' | grep -q .; then
            echo 'Rascunho exposto no build' >&2
            exit 1
          fi
