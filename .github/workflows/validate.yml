name: Validar rascunhos e sincronização
on:
  pull_request:
  push:
    branches-ignore: [main, auto/rascunho-releases]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Garantir que rascunhos não estejam no build
        run: node scripts/check-draft-build.mjs
