name: Sincronizar releases e gerar rascunhos

on:
  schedule:
    # Segunda-feira 09:00 America/Sao_Paulo (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sem criar arquivos nem abrir PR'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: sync-releases
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Verificar releases e gerar rascunhos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preservar PR pendente
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:auto/rascunho-releases" --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "Rascunho pendente: revisão preservada, coleta adiada." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Executar sync-releases.mjs
        id: sync
        if: steps.pending.outputs.count == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        # Exit 0  = nada novo (nao abre PR)
        # Exit 2  = rascunhos gerados (abre PR)
        # Exit 1  = erro fatal (falha o job)
        run: |
          set +e
          output=$(node scripts/sync-releases.mjs 2>&1)
          exit_code=$?
          echo "$output"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ $exit_code -eq 2 ]; then
            # Extrai o summary da linha GENERATED_SUMMARY= e grava com delimitador
            # para evitar quebras se tags contiverem caracteres especiais.
            summary=$(echo "$output" | grep '^GENERATED_SUMMARY=' | head -1 | cut -d= -f2- | tr -cd '[:alnum:] .,/-')
            {
              echo "summary<<EOF_SUMMARY"
              echo "$summary"
              echo "EOF_SUMMARY"
            } >> "$GITHUB_OUTPUT"
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          elif [ $exit_code -eq 0 ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            exit $exit_code
          fi

      - name: Registrar coleta sem commits de status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report
          path: .sync/report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Abrir PR com rascunhos
        if: steps.sync.outputs.has_new == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          branch: auto/rascunho-releases
          base: main
          commit-message: |
            feat: rascunhos de post para ${{ steps.sync.outputs.summary }}

            Gerado automaticamente pelo workflow sync-releases.
          title: 'Rascunho: ${{ steps.sync.outputs.summary }}'
          body: |
            ## Rascunhos gerados automaticamente

            Este PR foi aberto pelo workflow `sync-releases` apos detectar releases e PRs mergeadas
            relevantes nos projetos monitorados.

            **Coleta:** `${{ steps.sync.outputs.summary }}`

            ### Fluxo de revisão

            1. Revise cada arquivo `.md` em `src/content/posts/`
            2. Ajuste título, descrição, tags e tom conforme necessário
            3. Altere `draft: true` para `draft: false` quando o post estiver pronto
            4. Obtenha decisão explícita para publicar e enviar antes do merge.

            ### Estado e aprovação

            Nenhum estado de publicação é avançado pelo rascunho. IDs e janela são
            derivados somente de posts publicados. PR aberta bloqueia substituição.
            Merge com draft:false publica no site E DISPARA NEWSLETTER; requer decisão
            explícita de publicação e envio. Este workflow somente prepara rascunhos.
          labels: rascunho-auto
          add-paths: |
            src/content/posts/**
